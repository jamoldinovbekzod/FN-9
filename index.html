<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <header class="box">
            <nav class="nav-main">
                <div class="logo">
                    <a href="./index.html">
                        <img src="./images/Logo.svg" alt="logo" />
                    </a>
                </div>
                <div class="tasks">
                    <a href="#" class="link">Home</a>
                    <a href="#" class="link">About</a>
                    <a href="#" class="link">Popular</a>
                    <a href="#" class="link">Featured</a>
                </div>
            </nav>
            <div class="nav-texts">
                <h1>Choose The Best Car</h1>
                <p>Porsche Mission E</p>
                <img class="icon" src="./images/icon.png" alt="icon" />
                <img  class="car" src="./images/car.png" alt="car" />

                <section class="car-about">
                    <div class="car-temp">
                        <img src="./images/temp.svg" alt="temp" />
                        <h1>24°</h1>
                        <p>TEMPERATURE</p>
                    </div>
                    <div class="car-mile">
                        <img src="./images/mil.svg" alt="mile" />
                        <h1>873</h1>
                        <p>MILEAGE</p>
                    </div>
                    <div class="car-battery">
                        <img src="./images/batary.svg" alt="battery" />
                        <h1>94%</h1>
                        <p>BATTERY</p>
                    </div>
                </section>
            </div>
            <div class="nav-btn">
                <button class="btn-1" type="button">
                    <span class="btn-2">START</span>
                </button>
            </div>

        </header>
        <main></main>
        <footer></footer>
    </body>
</html>
